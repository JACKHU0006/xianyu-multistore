<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>多店铺智控控制台 · 原型</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0e1014; --panel:#151922; --panel2:#1b2130; --panel3:#212838;
    --border:#242b39; --border2:#2e3648;
    --text:#e7ebf3; --muted:#8a93a8; --dim:#5d6679;
    --accent:#4f8cff; --accent-soft:rgba(79,140,255,.14);
    --ok:#2fd18c; --ok-soft:rgba(47,209,140,.14);
    --warn:#ffb020; --warn-soft:rgba(255,176,32,.14);
    --danger:#ff5f6d; --danger-soft:rgba(255,95,109,.14);
    --radius:12px;
  }
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  .app{display:flex;min-height:100vh}

  /* ---------- Sidebar ---------- */
  .sidebar{width:248px;flex:none;background:var(--panel);border-right:1px solid var(--border);
    padding:18px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 4px}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4f8cff,#7b5cff);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff}
  .brand h1{font-size:14.5px;font-weight:600;letter-spacing:.2px}
  .brand p{font-size:11px;color:var(--dim);letter-spacing:.3px}

  .sec-label{font-size:11px;color:var(--dim);letter-spacing:1px;padding:0 8px;margin-bottom:8px;text-transform:uppercase}

  .store-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;transition:.15s}
  .store-item:hover{background:var(--panel2)}
  .store-item.active{background:var(--accent-soft);border-color:rgba(79,140,255,.35)}
  .store-item .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .dot.danger{background:var(--danger);box-shadow:0 0 8px var(--danger)}
  .store-item .nm{flex:1;min-width:0}
  .store-item .nm b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .store-item .nm span{font-size:11px;color:var(--dim)}

  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--muted);
    text-decoration:none;font-size:13.5px;cursor:pointer;transition:.15s}
  .nav a:hover{background:var(--panel2);color:var(--text)}
  .nav a.active{background:var(--panel3);color:var(--text);font-weight:500}
  .nav a .ic{width:16px;text-align:center;opacity:.9}
  .nav a .tag{margin-left:auto;font-size:10.5px;background:var(--danger-soft);color:var(--danger);
    padding:1px 7px;border-radius:20px;font-weight:600}

  .compliance{margin-top:auto;background:var(--panel2);border:1px solid var(--border2);border-radius:10px;
    padding:11px 12px;font-size:11.5px;color:var(--muted);line-height:1.6}
  .compliance b{color:var(--warn);display:block;margin-bottom:3px;font-size:11.5px}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:66px;flex:none;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;align-items:center;gap:16px;padding:0 26px;position:sticky;top:0;z-index:5}
  .topbar h2{font-size:16px;font-weight:600}
  .topbar .sub{font-size:11.5px;color:var(--dim);margin-top:1px}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 11px;border-radius:20px;
    border:1px solid var(--border2);color:var(--muted);background:var(--panel2)}
  .pill.ok{color:var(--ok);border-color:rgba(47,209,140,.35);background:var(--ok-soft)}
  .pill.warn{color:var(--warn);border-color:rgba(255,176,32,.35);background:var(--warn-soft)}
  .pill.danger{color:var(--danger);border-color:rgba(255,95,109,.35);background:var(--danger-soft)}
  .pill.accent{color:var(--accent);border-color:rgba(79,140,255,.35);background:var(--accent-soft)}

  .view{padding:24px 26px 40px;display:flex;flex-direction:column;gap:18px}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .card-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .card-h h3{font-size:13.5px;font-weight:600}
  .card-h .desc{font-size:11.5px;color:var(--dim)}
  .card-b{padding:16px 18px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px}
  .stat .k{font-size:11.5px;color:var(--dim);margin-bottom:7px}
  .stat .v{font-size:25px;font-weight:600;letter-spacing:-.5px}
  .stat .d{font-size:11px;color:var(--muted);margin-top:3px}
  .stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)} .stat .v.danger{color:var(--danger)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:500;color:var(--dim);font-size:11.5px;letter-spacing:.4px;
    padding:0 12px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}
  td .t1{font-weight:500}
  td .t2{font-size:11.5px;color:var(--dim)}

  input[type=text],input[type=number],select,textarea{
    background:var(--bg);border:1px solid var(--border2);color:var(--text);border-radius:7px;
    padding:6px 9px;font-size:12.5px;font-family:inherit;outline:none;transition:.15s;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  input.w-num{width:82px;text-align:right;font-variant-numeric:tabular-nums}

  .btn{border:1px solid var(--border2);background:var(--panel2);color:var(--text);border-radius:8px;
    padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
  .btn:hover{background:var(--panel3);border-color:#3b465c}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#3d7cf5}
  .btn.sm{padding:4px 10px;font-size:11.5px}
  .btn.ghost{background:transparent}

  .sw{position:relative;width:38px;height:21px;border-radius:20px;background:var(--panel3);
    border:1px solid var(--border2);cursor:pointer;transition:.2s;flex:none}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
    background:var(--muted);transition:.2s}
  .sw.on{background:var(--ok-soft);border-color:rgba(47,209,140,.5)}
  .sw.on::after{left:19px;background:var(--ok)}

  .banner{display:flex;gap:13px;align-items:flex-start;padding:14px 17px;border-radius:var(--radius);
    border:1px solid rgba(255,176,32,.35);background:var(--warn-soft);font-size:13px}
  .banner.danger{border-color:rgba(255,95,109,.35);background:var(--danger-soft)}
  .banner .bi{font-size:17px;line-height:1.2}
  .banner b{display:block;margin-bottom:3px}
  .banner p{color:var(--muted);font-size:12.5px}
  .banner .acts{margin-top:10px;display:flex;gap:8px}

  .log{display:flex;flex-direction:column;gap:12px;max-height:520px;overflow:auto;padding-right:4px}
  .msg{display:flex;gap:10px}
  .msg .av{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:600;background:var(--panel3);color:var(--muted)}
  .msg.buyer .av{background:var(--accent-soft);color:var(--accent)}
  .msg.ai .av{background:var(--ok-soft);color:var(--ok)}
  .msg .body{flex:1;min-width:0}
  .msg .meta{font-size:11px;color:var(--dim);margin-bottom:4px;display:flex;gap:8px;align-items:center}
  .msg .bubble{background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:9px 12px;font-size:13px;display:inline-block;max-width:78%}
  .msg.ai .bubble{background:var(--panel3);border-color:var(--border2)}
  .intent{font-size:10px;padding:1px 7px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:600}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted)}
  .kv .v{font-weight:500}

  .empty{padding:34px;text-align:center;color:var(--dim);font-size:13px}
  .hint{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.6}
  .row{display:flex;align-items:center;gap:10px}
  .muted{color:var(--muted)}
  .dim{color:var(--dim)}
  .mono{font-family:"SF Mono",Consolas,Monaco,monospace;font-size:12px}
  @media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.sidebar{width:210px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">闲</div>
      <div><h1>多店铺智控台</h1><p>MULTI-STORE CONSOLE</p></div>
    </div>

    <div>
      <div class="sec-label">我的店铺</div>
      <div id="storeList"></div>
      <button class="btn ghost sm" style="margin-top:8px;width:100%" onclick="alert('接入新店铺：\n\n1. 店主本人在自己的设备上完成扫码登录\n2. 系统仅保存加密后的会话引用（vault_ref），不落地明文 Cookie\n3. 新店铺自动获得独立租户空间，数据与其它店铺完全隔离')">+ 接入店铺</button>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="compliance">
      <b>⚠ 合规模式已开启</b>
      本控制台不提供 Cookie 共享、设备伪装、代理轮换与验证码绕过。人机验证一律转人工，由店主本人处理。
    </div>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="view" id="view"></div>
  </main>
</div>

<script>

      ],

        { id:"c2", product:"爱奇艺黄金会员 年卡", content:"B3D8-1L6N-WR44-8YT2", used:false },

        { id:"m3", kw:"AirPods Pro 2 正品", min:700, max:1050, desire:10, ai:false, on:false, hits:0 }
      ],
      logs: [

        { who:"ai", name:"AI 客服", time:"18:12", intent:"BARGAIN", text:"您好～两张的话给您走个批量价，256 元两张，等于 128 一张，已经是全年最低啦 😊" },
        { who:"buyer", name:"买家 l***7", time:"18:13", intent:"DEAL", text:"行，那我拍了" },
        { who:"ai", name:"AI 客服", time:"18:13", intent:"DEAL", text:"好的，拍下后系统会自动发卡密，注意查收私信～" },
        { who:"buyer", name:"买家 m***2", time:"18:05", intent:"ENQUIRY", text:"手机壳支持无线充电吗" },
        { who:"ai", name:"AI 客服", time:"18:05", intent:"ENQUIRY", text:"支持 MagSafe 磁吸，无线充电可以直接用，不影响散热。" }
      ]
    },

      status: "ok", statusText: "在线", todayMsg: 87, pendingShip: 0, alerts: 0,
      note: "纯虚拟商品，全自动发货，无需人工",
      products: [
        { id:"p5", itemId:"721003311001", title:"网易云黑胶 VIP 季卡", price:42, min:35, ship:"虚拟发货", sendType:"CARD_POOL", faq:7, stock:210, sold:3320 },
        { id:"p6", itemId:"721003311002", title:"百度网盘超级会员 月卡", price:19, min:15, ship:"虚拟发货", sendType:"CARD_POOL", faq:5, stock:158, sold:1890 }
      ],

        { id:"c6", product:"网易云黑胶 VIP 季卡", content:"WY42-KK81-2MZP-77QT", used:false },
        { id:"c7", product:"网易云黑胶 VIP 季卡", content:"WY55-QQ20-9LRN-33VD", used:false },

      ],
      monitors: [
        { id:"m4", kw:"腾讯视频 年卡", min:150, max:210, desire:6, ai:true, on:true, hits:2 }

        { who:"ai", name:"AI 客服", time:"17:58", intent:"ENQUIRY", text:"支付成功后 5 秒内自动发送，如果没收到直接回我，我立刻补发。" },

      products: [
        { id:"p7", itemId:"721155522001", title:"二手 iPad Air 4 64G 蓝色", price:1980, min:1750, ship:"包邮", sendType:"NONE", faq:12, stock:1, sold:6 },
        { id:"p8", itemId:"721155522002", title:"二手 Apple Watch S7 45mm", price:1150, min:980, ship:"包邮", sendType:"NONE", faq:8, stock:1, sold:11 }
      ],
      cards: [],
      monitors: [
        { id:"m5", kw:"MacBook Air M1 8+256", min:3200, max:4200, desire:5, ai:true, on:true, hits:4 }
      ],
      logs: [

        { who:"ai", name:"AI 客服", time:"16:40", intent:"ENQUIRY", text:"电池健康 91%，循环 217 次，可以拍电池检测截图给您。" },
        { who:"system", name:"系统", time:"16:52", intent:"RISK", text:"检测到账号需要人工身份验证，监听已挂起。请在手机端闲鱼 App 完成验证后点击「恢复监听」。" }
      ]
    }
  ]
};

const VIEWS = [
  { id:"dashboard", name:"总览", ic:"▦" },
  { id:"products",  name:"商品与 AI 规则", ic:"◫" },
  { id:"cards",     name:"卡密池", ic:"▤" },
  { id:"monitors",  name:"捡漏监控", ic:"◎" },
  { id:"logs",      name:"会话日志", ic:"✉" },
  { id:"settings",  name:"店铺设置", ic:"⚙" }
];

let curStore = "s1";
let curView = "dashboard";

const $ = (id) => document.getElementById(id);
const store = () => DATA.stores.find(s => s.id === curStore);

/* ---------------- Sidebar ---------------- */
function renderStoreList(){
  $("storeList").innerHTML = store0().map(s => `
    <div class="store-item ${s.id===curStore?'active':''}" onclick="switchStore('${s.id}')">
      <span class="dot ${s.status}"></span>
      <span class="nm"><b>${s.name}</b><span>${s.account} · ${s.owner}</span></span>
    </div>`).join("");
}
function store0(){ return DATA.stores; }

function renderNav(){
  const alertCount = store().alerts;
  $("nav").innerHTML = VIEWS.map(v => `
    <a class="${v.id===curView?'active':''}" onclick="switchView('${v.id}')">
      <span class="ic">${v.ic}</span><span>${v.name}</span>
      ${v.id==="settings" && alertCount ? `<span class="tag">${alertCount}</span>` : ""}
    </a>`).join("");
}

/* ---------------- Topbar ---------------- */
function renderTopbar(){
  const s = store();
  $("topbar").innerHTML = `
    <div>
      <h2>${VIEWS.find(v=>v.id===curView).name}</h2>
      <div class="sub">${s.name} · ${s.account} · 负责人 ${s.owner}</div>
    </div>
    <div class="spacer"></div>
    <span class="pill">今日咨询 <b style="color:var(--text);margin-left:4px">${s.todayMsg}</b></span>
    <span class="pill ${s.pendingShip?"warn":"ok"}">待发货 <b style="margin-left:4px">${s.pendingShip}</b></span>
    <span class="pill ${s.status==='ok'?'ok':s.status==='warn'?'warn':'danger'}">
      <span class="dot ${s.status}" style="width:6px;height:6px"></span>${s.statusText}
    </span>`;
}

/* ---------------- Views ---------------- */
function renderView(){
  const fn = { dashboard:vDashboard, products:vProducts, cards:vCards,
               monitors:vMonitors, logs:vLogs, settings:vSettings }[curView];
  $("view").innerHTML = fn(store());
}

function vDashboard(s){
  const online = DATA.stores.filter(x=>x.status==="ok").length;
  const totalMsg = DATA.stores.reduce((a,b)=>a+b.todayMsg,0);
  const totalPend = DATA.stores.reduce((a,b)=>a+b.pendingShip,0);
  const riskStore = DATA.stores.filter(x=>x.status!=="ok");
  return `
    ${riskStore.length ? riskStore.map(x=>`
      <div class="banner danger">
        <span class="bi">⚠</span>
        <div style="flex:1">
          <b>${x.name} 需要人工处理</b>
          <p>${x.note}。系统已挂起该店铺的监听队列，不会代过验证。</p>
          <div class="acts"><button class="btn sm" onclick="switchStore('${x.id}');switchView('settings')">前往处理</button></div>
        </div>
      </div>`).join("") : ""}

    <div class="stats">
      <div class="stat"><div class="k">接入店铺</div><div class="v">${DATA.stores.length}</div><div class="d">${online} 家在线</div></div>
      <div class="stat"><div class="k">今日咨询总量</div><div class="v">${totalMsg}</div><div class="d">AI 自动处理 94%</div></div>
      <div class="stat"><div class="k">待发货订单</div><div class="v ${totalPend?'warn':'ok'}">${totalPend}</div><div class="d">虚拟商品自动秒发</div></div>

      <div>
        <b>出库幂等保护</b>

/* ---------------- Actions ---------------- */
function switchStore(id){ curStore = id; curView = "dashboard"; renderAll(); }
function switchView(v){ curView = v; renderAll(); }

function editPrice(pid, field, val){
  const p = store().products.find(x=>x.id===pid);
  if(!p) return;
  const n = Number(val);
  if(field==="min" && n > p.price){ alert("底价不能高于挂牌价"); renderView(); return; }
  p[field] = n;
  renderView();
}

function toggleMonitor(id){
  const m = store().monitors.find(x=>x.id===id);
  if(m){ m.on = !m.on; renderView(); }
}

function resumeStore(){
  const s = store();
  s.status = "ok"; s.statusText = "在线"; s.alerts = 0;
  s.note = "登录态已由店主本人恢复，监听正常运行";
  s.logs.push({ who:"system", name:"系统", time:"刚刚", intent:"SYSTEM",
    text:"店主已完成身份验证，消息监听已恢复。" });
  renderAll();
}

function renderAll(){ renderStoreList(); renderNav(); renderTopbar(); renderView(); }
renderAll();
