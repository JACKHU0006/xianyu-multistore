name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 测试自带密钥提供者与 SQLite 临时库，不需要任何真实密钥。
      - name: 运行测试
        run: python -m pytest tests/ -q

  postgres:
    name: 后端测试（PostgreSQL）
    runs-on: ubuntu-latest
    # 为什么要有这一条：默认那一组跑的是 SQLite，而 SQLite 与 PostgreSQL 行为并不
    # 一致 —— 时区（naive vs aware）、VARCHAR 长度校验、LIKE 大小写、JSON 列语义
    # 都不同。最危险的是「在 SQLite 上通过、在 PG 上失败」的差异：它只会在生产上
    # 炸。这一组把同一套测试连真实 PG 再跑一遍，让这类差异在合并前暴露。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xianyu_test
        ports:
          - 5432:5432
        # 不加健康检查的话，容器刚起来 PG 还没接受连接，测试会连不上
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 迁移校验必须放在跑测试**之前**。
      #
      # 原因：测试用例会 drop_all/create_all，跑完之后库里是「有表但没有
      # alembic_version」的状态。此时再执行 `alembic upgrade head`，基线迁移会
      # 被重放一遍，直接撞上已存在的表报 `table already exists` ——
      # 这正是 docs/MIGRATIONS.md 里记的那个坑。
      # 放在前面就简单了：service 刚起来的库是空的，upgrade 能真实地建出全部表，
      # 从而验证迁移本身（而不是被前面的测试结果掩盖）。
      - name: 校验迁移在 PostgreSQL 上可用
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/xianyu_test
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic downgrade base
          python -m alembic upgrade head

      # 注意：PG 模式下测试会 drop_all/create_all，只能对准专用测试库，
      # 所以这里写死 xianyu_test，不要复用任何有数据的库。
      - name: 运行测试（PostgreSQL 后端）
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/xianyu_test
        run: python -m pytest tests/ -q

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build
